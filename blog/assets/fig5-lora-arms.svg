<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect width="880" height="400" rx="12" fill="#fcfcfb"/>
<rect x="0.5" y="0.5" width="879" height="399" rx="12" fill="none" stroke="rgba(11,11,11,0.10)"/>
<text x="28" y="34" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">Where the trainable pieces attach, and why the counts are small</text>
<text x="28" y="54" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">LoRA freezes the whole model and trains a thin detour beside chosen weight matrices. The arms differ only in which matrices get one.</text>
<circle cx="33" cy="78" r="5" fill="#2a78d6"/>
<text x="43" y="82" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">both arms train these</text>
<circle cx="204.4" cy="78" r="5" fill="#eb6834"/>
<text x="214.4" y="82" font-size="12" fill="#52514e" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">arm B also trains these</text>
<rect x="28" y="94" width="400" height="240" rx="10" fill="none" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="44" y="114" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">one transformer block (×28)</text>
<text x="48" y="141" font-size="12" fill="#52514e" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">attention</text>
<rect x="48" y="148" width="170" height="34" rx="8" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="133" y="169" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">q_proj 1536→1536</text>
<rect x="48" y="192" width="170" height="34" rx="8" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="133" y="213" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">k_proj 1536→256</text>
<rect x="48" y="236" width="170" height="34" rx="8" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="133" y="257" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">v_proj 1536→256</text>
<rect x="48" y="280" width="170" height="34" rx="8" fill="#eaf1fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="133" y="301" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">o_proj 1536→1536</text>
<text x="240" y="141" font-size="12" fill="#52514e" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">MLP</text>
<rect x="240" y="148" width="170" height="34" rx="8" fill="#fdece4" stroke="#eb6834" stroke-width="1.5"/>
<text x="325" y="169" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">gate_proj 1536→8960</text>
<rect x="240" y="192" width="170" height="34" rx="8" fill="#fdece4" stroke="#eb6834" stroke-width="1.5"/>
<text x="325" y="213" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">up_proj 1536→8960</text>
<rect x="240" y="236" width="170" height="34" rx="8" fill="#fdece4" stroke="#eb6834" stroke-width="1.5"/>
<text x="325" y="257" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">down_proj 8960→1536</text>
<text x="480" y="114" font-size="12" fill="#52514e" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">the detour math, per 1536×1536 matrix</text>
<rect x="480" y="130" width="110" height="110" rx="4" fill="#e1e0d9"/>
<text x="535" y="258" font-size="11" fill="#898781" font-weight="400" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">frozen 1536×1536</text>
<text x="535" y="273" font-size="11" fill="#898781" font-weight="400" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">≈ 2.36M weights</text>
<text x="614" y="191" font-size="17" fill="#52514e" font-weight="600" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">+</text>
<rect x="638" y="130" width="13" height="110" rx="3" fill="#2a78d6"/>
<rect x="659" y="130" width="110" height="13" rx="3" fill="#2a78d6"/>
<text x="705" y="258" font-size="11" fill="#898781" font-weight="400" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">trained 16×(1536+1536)</text>
<text x="705" y="273" font-size="11" fill="#898781" font-weight="400" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">≈ 49k weights (2.1%)</text>
<circle cx="36" cy="356" r="5" fill="#2a78d6"/>
<text x="50" y="360" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start" font-family="ui-monospace, Menlo, monospace">arm A · attention only · 155,648 per block × 28 = 4,358,144 trainable (0.28%)</text>
<circle cx="36" cy="380" r="5" fill="#eb6834"/>
<text x="50" y="384" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start" font-family="ui-monospace, Menlo, monospace">arm B · attention + MLP · 659,456 per block × 28 = 18,464,768 trainable (1.18%)</text>
</svg>